[project]
name = "document-intelligence-agent"
version = "0.1.0"
description = "Tool-calling agent that extracts and validates structured data from documents."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are the documented idiom
