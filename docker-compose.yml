# The whole stack: the agent API, its Postgres database, the dashboard, and n8n.
#
#   docker compose up -d --build
#
#   dashboard  http://localhost:3000
#   api        http://localhost:8000   (other services reach it as http://api:8000)
#   db         localhost:5432          (Postgres; user and database below)
#   n8n        http://localhost:5678
#
# CI starts only `db` and `api`. See "Continuous integration" and "Workflow
# automation (n8n)" in the README.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      # A development default. Set POSTGRES_PASSWORD in .env for anything that
      # is reachable from outside this machine.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoice_dev}
      POSTGRES_DB: invoice_agent
    ports:
      # Bound to this machine only, for psql and other SQL clients.
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    # Keys come from .env. Optional so the stack also starts without one (CI
    # brings it up to smoke-test the endpoints before any key is involved).
    env_file:
      - path: .env
        required: false
    environment:
      # Set here, after env_file, so the container always uses the db service
      # whatever DATABASE_URL a local .env holds.
      DATABASE_URL: postgresql+psycopg://invoice:${POSTGRES_PASSWORD:-invoice_dev}@db:5432/invoice_agent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        # The API as the *browser* reaches it, compiled into the bundle.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    # Pinned: a workflow file is tied to the node versions of the release that
    # runs it. Check https://github.com/n8n-io/n8n/releases before bumping.
    image: n8nio/n8n:2.47.7
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5678/
      # Plain http on localhost: the login cookie must not require https.
      N8N_SECURE_COOKIE: "false"
      # Docker Desktop on Windows cannot enforce file modes on its volumes.
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      TZ: ${TZ:-Europe/Berlin}

      # The folder trigger is switched off by default since n8n 2.0. Turn it
      # back on, but leave Execute Command (arbitrary shell) off.
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand"]'
      # File nodes may read only the mounted inbox, nothing else in the container.
      N8N_RESTRICT_FILE_ACCESS_TO: /files

      # The workflow reads the two URLs below with $env; n8n 2.0 blocks that
      # unless told otherwise. Acceptable here: one user, one machine.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      AGENT_URL: http://api:8000
      # Where results are announced. Any endpoint that accepts {"text": "..."}
      # works, e.g. a Slack incoming webhook. The default is the API's own
      # /notifications inbox, so the stack works with no outside account.
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-http://api:8000/notifications}
    volumes:
      - n8n_data:/home/node/.n8n
      # Drop a PDF into n8n/files/inbox on the host and the workflow picks it up.
      - ./n8n/files:/files
      - ./n8n/workflows:/workflows:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  n8n_data:
